# 放入 Nginx 的 http 上下文（例如 /etc/nginx/conf.d/algo-practice.conf）
# 根据实际域名与部署目录修改 server_name 和 root。
server {
    listen 80;
    server_name study.example.com;

    root /var/www/algo-practice;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
