<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">常见时间复杂度的函数增长曲线</title>
  <desc id="desc">在输入规模从零增长到二十时，对比常数、对数、线性、线性对数和平方复杂度的增长速度。</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px system-ui, sans-serif; fill: #111827; }
    .subtitle, .tick, .note { font: 14px system-ui, sans-serif; fill: #475569; }
    .axis-label { font: 16px system-ui, sans-serif; fill: #1f2937; }
    .curve-label { font: 700 15px system-ui, sans-serif; }
    .axis { stroke: #64748b; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .constant { stroke: #64748b; fill: none; stroke-width: 4; }
    .log { stroke: #16a34a; fill: none; stroke-width: 4; }
    .linear { stroke: #2563eb; fill: none; stroke-width: 4; }
    .nlogn { stroke: #7c3aed; fill: none; stroke-width: 4; }
    .square { stroke: #ea580c; fill: none; stroke-width: 4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .title { fill: #f8fafc; }
      .subtitle, .tick, .note { fill: #cbd5e1; }
      .axis-label { fill: #e2e8f0; }
      .axis { stroke: #94a3b8; }
      .grid { stroke: #334155; }
      .constant { stroke: #cbd5e1; }
      .log { stroke: #4ade80; }
      .linear { stroke: #60a5fa; }
      .nlogn { stroke: #c084fc; }
      .square { stroke: #fb923c; }
    }
  </style>

  <rect class="bg" width="1000" height="700" rx="16"/>
  <text class="title" x="500" y="42" text-anchor="middle">常见时间复杂度的增长速度</text>
  <text class="subtitle" x="500" y="68" text-anchor="middle">横轴是输入规模 n，纵轴是大致操作次数；超过 400 的部分被截断</text>

  <!-- horizontal grid -->
  <line class="grid" x1="90" y1="570" x2="930" y2="570"/>
  <line class="grid" x1="90" y1="447.5" x2="930" y2="447.5"/>
  <line class="grid" x1="90" y1="325" x2="930" y2="325"/>
  <line class="grid" x1="90" y1="202.5" x2="930" y2="202.5"/>
  <line class="grid" x1="90" y1="80" x2="930" y2="80"/>

  <!-- vertical grid -->
  <line class="grid" x1="90" y1="80" x2="90" y2="570"/>
  <line class="grid" x1="300" y1="80" x2="300" y2="570"/>
  <line class="grid" x1="510" y1="80" x2="510" y2="570"/>
  <line class="grid" x1="720" y1="80" x2="720" y2="570"/>
  <line class="grid" x1="930" y1="80" x2="930" y2="570"/>

  <line class="axis" x1="90" y1="570" x2="944" y2="570"/>
  <line class="axis" x1="90" y1="580" x2="90" y2="70"/>

  <text class="tick" x="90" y="594" text-anchor="middle">0</text>
  <text class="tick" x="300" y="594" text-anchor="middle">5</text>
  <text class="tick" x="510" y="594" text-anchor="middle">10</text>
  <text class="tick" x="720" y="594" text-anchor="middle">15</text>
  <text class="tick" x="930" y="594" text-anchor="middle">20</text>

  <text class="tick" x="76" y="575" text-anchor="end">0</text>
  <text class="tick" x="76" y="452" text-anchor="end">100</text>
  <text class="tick" x="76" y="330" text-anchor="end">200</text>
  <text class="tick" x="76" y="207" text-anchor="end">300</text>
  <text class="tick" x="76" y="85" text-anchor="end">400</text>

  <text class="axis-label" x="510" y="625" text-anchor="middle">输入规模 n</text>
  <text class="axis-label" x="22" y="325" transform="rotate(-90 22 325)" text-anchor="middle">操作次数（示意）</text>

  <!-- curves: x = 90 + 42n; y = 570 - 1.225f(n) -->
  <path class="constant" d="M90 568.8 L930 568.8"/>
  <path class="log" d="M132 570 L174 568.8 L258 567.6 L426 566.3 L762 565.1 L930 564.7"/>
  <path class="linear" d="M90 570 L300 563.9 L510 557.8 L720 551.6 L930 545.5"/>
  <path class="nlogn" d="M90 570 L132 570 L174 567.6 L258 560.2 L426 540.6 L594 517.3 L762 491.6 L930 464.2"/>
  <path class="square" d="M90 570 L174 565.1 L258 550.4 L342 525.9 L426 491.6 L510 447.5 L594 393.6 L678 329.9 L762 256.4 L846 173.1 L930 80"/>
  <text class="curve-label" x="830" y="110" fill="#ea580c">O(n²)</text>
  <text class="curve-label" x="790" y="448" fill="#7c3aed">O(n log n)</text>
  <text class="curve-label" x="790" y="535" fill="#2563eb">O(n)</text>
  <text class="curve-label" x="650" y="612" fill="#16a34a">O(log n) 和 O(1) 几乎贴着横轴</text>

  <rect x="90" y="646" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="note" x="112" y="658">O(1)</text>
  <rect x="175" y="646" width="14" height="14" rx="3" fill="#16a34a"/>
  <text class="note" x="197" y="658">O(log n)</text>
  <rect x="290" y="646" width="14" height="14" rx="3" fill="#2563eb"/>
  <text class="note" x="312" y="658">O(n)</text>
  <rect x="375" y="646" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text class="note" x="397" y="658">O(n log n)</text>
  <rect x="515" y="646" width="14" height="14" rx="3" fill="#ea580c"/>
  <text class="note" x="537" y="658">O(n²)</text>
</svg>
